name: Build Android APK

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      build_type:
        description: "Тип сборки"
        required: true
        default: "debug"
        type: choice
        options:
          - debug
          - release

env:
  JAVA_VERSION: "17"
  GRADLE_VERSION: "8.9"

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      # ──────────────────────────────────────────────────────────────────────
      - name: Checkout code
        uses: actions/checkout@v4

      # ──────────────────────────────────────────────────────────────────────
      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: "temurin"
          cache: "gradle"

      # ──────────────────────────────────────────────────────────────────────
      - name: Set up Gradle ${{ env.GRADLE_VERSION }}
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}
          cache-read-only: false

      # ──────────────────────────────────────────────────────────────────────
      - name: Generate Gradle wrapper
        run: |
          gradle wrapper --gradle-version ${{ env.GRADLE_VERSION }} --distribution-type bin
          chmod +x gradlew

      # ──────────────────────────────────────────────────────────────────────
      - name: Accept Android SDK licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses 2>/dev/null || true
          echo "sdk.dir=$ANDROID_HOME" > local.properties

      # ──────────────────────────────────────────────────────────────────────
      # Скачиваем libv2ray AAR напрямую из GitHub Releases.
      # JitPack не используется — он требует аутентификацию для этого репо.
      - name: Download libv2ray AAR
        run: |
          echo "=== Скачиваем libv2ray AAR из GitHub Releases ==="
          mkdir -p app/libs

          DOWNLOADED=false

          # Список репозиториев для поиска AAR (в порядке приоритета)
          REPOS="2dust/AndroidLibXrayLite 2dust/libv2ray"

          for REPO in $REPOS; do
            echo "Пробуем репозиторий: $REPO"

            RELEASE_DATA=$(curl -sf \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/$REPO/releases/latest" 2>/dev/null || echo "")

            if [ -z "$RELEASE_DATA" ] || [ "$RELEASE_DATA" = "" ]; then
              echo "  Не удалось получить данные релиза для $REPO"
              continue
            fi

            TAG=$(echo "$RELEASE_DATA" | \
              python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('tag_name',''))" \
              2>/dev/null || echo "")
            echo "  Версия: ${TAG:-не найдена}"

            # Ищем AAR в ассетах релиза
            ASSET_URL=$(echo "$RELEASE_DATA" | \
              python3 -c "
          import sys, json
          d = json.load(sys.stdin)
          assets = d.get('assets', [])
          aar = next((a['browser_download_url'] for a in assets if a['name'].endswith('.aar')), '')
          print(aar)
          " 2>/dev/null || echo "")

            if [ -n "$ASSET_URL" ]; then
              echo "  Найден AAR: $ASSET_URL"
              if curl -fL "$ASSET_URL" -o app/libs/libv2ray-release.aar; then
                echo "  AAR скачан: $(ls -lh app/libs/libv2ray-release.aar)"
                DOWNLOADED=true
                break
              else
                echo "  Не удалось скачать AAR"
              fi
            else
              echo "  AAR не найден в ассетах релиза"
            fi
          done

          if [ "$DOWNLOADED" = false ]; then
            echo ""
            echo "ОШИБКА: Не удалось скачать libv2ray AAR ни из одного репозитория."
            echo "Проверьте наличие релизов с AAR-файлами в:"
            echo "  - https://github.com/2dust/AndroidLibXrayLite/releases"
            echo "  - https://github.com/2dust/libv2ray/releases"
            exit 1
          fi

      # ──────────────────────────────────────────────────────────────────────
      - name: Show libv2ray config
        run: |
          echo "=== app/libs/ ==="
          ls -la app/libs/ 2>/dev/null || echo "(пусто)"

      # ──────────────────────────────────────────────────────────────────────
      - name: Build Debug APK
        if: github.event.inputs.build_type != 'release'
        run: |
          ./gradlew :app:assembleDebug \
            --no-daemon \
            --stacktrace \
            -Dorg.gradle.jvmargs="-Xmx4g -XX:+UseParallelGC"

      - name: Build Release APK (unsigned)
        if: github.event.inputs.build_type == 'release'
        run: |
          ./gradlew :app:assembleRelease \
            --no-daemon \
            --stacktrace \
            -Dorg.gradle.jvmargs="-Xmx4g -XX:+UseParallelGC"

      # ──────────────────────────────────────────────────────────────────────
      - name: Show built APKs
        if: always()
        run: |
          echo "=== Собранные APK ==="
          find app/build/outputs/apk -name "*.apk" -exec ls -lh {} \; 2>/dev/null || echo "APK не найдены"

      # ──────────────────────────────────────────────────────────────────────
      - name: Upload Debug APK
        if: github.event.inputs.build_type != 'release' && success()
        uses: actions/upload-artifact@v4
        with:
          name: EblanVPN-debug-${{ github.sha }}
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 30
          if-no-files-found: error

      - name: Upload Release APK
        if: github.event.inputs.build_type == 'release' && success()
        uses: actions/upload-artifact@v4
        with:
          name: EblanVPN-release-${{ github.sha }}
          path: app/build/outputs/apk/release/*.apk
          retention-days: 90
          if-no-files-found: error

      # ──────────────────────────────────────────────────────────────────────
      - name: Build summary
        if: always()
        run: |
          echo "### Результат сборки" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          LIBV2RAY_AAR=$(ls app/libs/libv2ray*.aar 2>/dev/null | head -1 || echo "")
          if [ -n "$LIBV2RAY_AAR" ]; then
            LIBV2RAY_SIZE=$(ls -lh "$LIBV2RAY_AAR" | awk '{print $5}')
            echo "**libv2ray:** \`$(basename "$LIBV2RAY_AAR")\` ($LIBV2RAY_SIZE)" >> $GITHUB_STEP_SUMMARY
          else
            echo "**libv2ray:** не найден" >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY
          APK_COUNT=$(find app/build/outputs/apk -name "*.apk" 2>/dev/null | wc -l)
          if [ "$APK_COUNT" -gt "0" ]; then
            echo "✅ APK успешно собран!" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "| Файл | Размер |" >> $GITHUB_STEP_SUMMARY
            echo "|------|--------|" >> $GITHUB_STEP_SUMMARY
            find app/build/outputs/apk -name "*.apk" | while read f; do
              SIZE=$(ls -lh "$f" | awk '{print $5}')
              NAME=$(basename "$f")
              echo "| \`$NAME\` | $SIZE |" >> $GITHUB_STEP_SUMMARY
            done
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "Скачайте APK во вкладке **Artifacts** выше ☝️" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ APK не собран — проверьте логи выше" >> $GITHUB_STEP_SUMMARY
          fi
