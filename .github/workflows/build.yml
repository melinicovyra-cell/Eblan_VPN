name: Build Android APK

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      build_type:
        description: "Тип сборки"
        required: true
        default: "debug"
        type: choice
        options:
          - debug
          - release

env:
  JAVA_VERSION: "17"
  GRADLE_VERSION: "8.9"

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      # ──────────────────────────────────────────────────────────────────────
      - name: Checkout code
        uses: actions/checkout@v4

      # ──────────────────────────────────────────────────────────────────────
      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: "temurin"
          cache: "gradle"

      # ──────────────────────────────────────────────────────────────────────
      - name: Set up Gradle ${{ env.GRADLE_VERSION }}
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}
          cache-read-only: false

      # ──────────────────────────────────────────────────────────────────────
      - name: Generate Gradle wrapper
        run: |
          gradle wrapper --gradle-version ${{ env.GRADLE_VERSION }} --distribution-type bin
          chmod +x gradlew

      # ──────────────────────────────────────────────────────────────────────
      - name: Accept Android SDK licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses 2>/dev/null || true
          echo "sdk.dir=$ANDROID_HOME" > local.properties

      # ──────────────────────────────────────────────────────────────────────
      # Скачиваем prebuilt libv2ray.aar из 2dust/AndroidLibXrayLite releases.
      # Это единственный надёжный способ — JitPack не собирает Go-проекты,
      # а старый репо 2dust/libv2ray больше не существует.
      - name: Download libv2ray AAR
        run: |
          echo "=== Скачиваем libv2ray.aar из AndroidLibXrayLite ==="
          mkdir -p app/libs

          # 1. Получаем данные последнего релиза
          RELEASE_DATA=$(curl -sf \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/2dust/AndroidLibXrayLite/releases/latest" 2>/dev/null || echo "")

          TAG=$(echo "$RELEASE_DATA" | \
            python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('tag_name',''))" \
            2>/dev/null || echo "")

          # 2. Fallback: Tags API
          if [ -z "$TAG" ]; then
            echo "Releases API не ответил, пробуем Tags API..."
            TAGS_DATA=$(curl -sf \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/2dust/AndroidLibXrayLite/tags?per_page=1" 2>/dev/null || echo "")
            TAG=$(echo "$TAGS_DATA" | \
              python3 -c "import sys,json; t=json.load(sys.stdin); print(t[0]['name'] if t else '')" \
              2>/dev/null || echo "")
          fi

          # 3. Последний резерв — известная рабочая версия
          if [ -z "$TAG" ]; then
            echo "Не удалось получить версию из GitHub API."
            TAG="v26.2.6"
          fi

          echo "Версия libv2ray: $TAG"
          echo "libv2ray_tag=$TAG" >> gradle.properties

          # 4. Ищем AAR URL в assets релиза
          ASSET_URL=$(echo "$RELEASE_DATA" | \
            python3 -c "
          import sys, json
          d = json.load(sys.stdin)
          assets = d.get('assets', [])
          aar = next((a['browser_download_url'] for a in assets if a['name'].endswith('.aar')), '')
          print(aar)
          " 2>/dev/null || echo "")

          # 5. Если release data не загрузилась, собираем URL вручную
          if [ -z "$ASSET_URL" ]; then
            ASSET_URL="https://github.com/2dust/AndroidLibXrayLite/releases/download/${TAG}/libv2ray.aar"
          fi

          echo "Скачиваем AAR: $ASSET_URL"
          curl -fL "$ASSET_URL" -o app/libs/libv2ray.aar

          if [ -f app/libs/libv2ray.aar ]; then
            echo "AAR скачан: $(ls -lh app/libs/libv2ray.aar)"
          else
            echo "::error::Не удалось скачать libv2ray.aar"
            exit 1
          fi

      # ──────────────────────────────────────────────────────────────────────
      - name: Show resolved libv2ray config
        run: |
          echo "=== gradle.properties ==="
          grep -i libv2ray gradle.properties 2>/dev/null || echo "(libv2ray_tag не установлен)"
          echo ""
          echo "=== app/libs/ ==="
          ls -la app/libs/ 2>/dev/null || echo "(пусто)"

      # ──────────────────────────────────────────────────────────────────────
      - name: Build Debug APK
        if: github.event.inputs.build_type != 'release'
        run: |
          ./gradlew :app:assembleDebug \
            --no-daemon \
            --stacktrace \
            -Dorg.gradle.jvmargs="-Xmx4g -XX:+UseParallelGC"

      - name: Build Release APK (unsigned)
        if: github.event.inputs.build_type == 'release'
        run: |
          ./gradlew :app:assembleRelease \
            --no-daemon \
            --stacktrace \
            -Dorg.gradle.jvmargs="-Xmx4g -XX:+UseParallelGC"

      # ──────────────────────────────────────────────────────────────────────
      - name: Show built APKs
        if: always()
        run: |
          echo "=== Собранные APK ==="
          find app/build/outputs/apk -name "*.apk" -exec ls -lh {} \; 2>/dev/null || echo "APK не найдены"

      # ──────────────────────────────────────────────────────────────────────
      - name: Upload Debug APK
        if: github.event.inputs.build_type != 'release' && success()
        uses: actions/upload-artifact@v4
        with:
          name: EblanVPN-debug-${{ github.sha }}
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 30
          if-no-files-found: error

      - name: Upload Release APK
        if: github.event.inputs.build_type == 'release' && success()
        uses: actions/upload-artifact@v4
        with:
          name: EblanVPN-release-${{ github.sha }}
          path: app/build/outputs/apk/release/*.apk
          retention-days: 90
          if-no-files-found: error

      # ──────────────────────────────────────────────────────────────────────
      - name: Build summary
        if: always()
        run: |
          echo "### Результат сборки" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          LIBV2RAY_VER=$(grep libv2ray_tag gradle.properties 2>/dev/null | cut -d= -f2 || echo "unknown")
          echo "**libv2ray версия:** \`$LIBV2RAY_VER\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          APK_COUNT=$(find app/build/outputs/apk -name "*.apk" 2>/dev/null | wc -l)
          if [ "$APK_COUNT" -gt "0" ]; then
            echo "✅ APK успешно собран!" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "| Файл | Размер |" >> $GITHUB_STEP_SUMMARY
            echo "|------|--------|" >> $GITHUB_STEP_SUMMARY
            find app/build/outputs/apk -name "*.apk" | while read f; do
              SIZE=$(ls -lh "$f" | awk '{print $5}')
              NAME=$(basename "$f")
              echo "| \`$NAME\` | $SIZE |" >> $GITHUB_STEP_SUMMARY
            done
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "Скачайте APK во вкладке **Artifacts** выше ☝️" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ APK не собран — проверьте логи выше" >> $GITHUB_STEP_SUMMARY
          fi
